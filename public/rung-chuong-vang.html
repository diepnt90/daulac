<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rung Chuông Vàng — Bé văn minh thanh lịch</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23392f;background:#f7f5ed}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:850px;margin:auto}.top,.panel{background:#fffefb;border:1px solid #e2e6dc;border-radius:22px;padding:22px;margin-bottom:16px}.eyebrow{color:#38775b;font-size:12px;font-weight:800;letter-spacing:2px}.title{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:8px 0}.muted{color:#728278}.controls,.options{display:grid;gap:10px}.controls{grid-template-columns:1fr 1fr;margin-top:18px}.options{grid-template-columns:1fr 1fr;margin-top:20px}.btn{padding:14px 16px;border:1px solid #dfe5da;border-radius:14px;background:white;color:#23392f;font:inherit;font-weight:650;text-align:left;cursor:pointer}.btn:hover{border-color:#38775b}.btn.chosen{background:#e7f3e9;border-color:#38775b}.btn.good{background:#e1f4e4;border-color:#3a8b55}.btn.bad{background:#fce9e5;border-color:#c65d54}.primary{background:#38775b;color:white;border:0;text-align:center}.hidden{display:none}.progress{height:8px;background:#e8ece3;border-radius:20px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:#38775b;width:0}.qtext{font-size:clamp(20px,3vw,27px);line-height:1.4;font-weight:750}.status{font-size:14px;color:#728278;margin-top:16px}.score{font-size:34px;font-weight:850}.end{text-align:center}@media(max-width:560px){body{padding:12px}.options,.controls{grid-template-columns:1fr}.top,.panel{padding:17px}}</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">BỘ CÂU HỎI TƯƠNG TÁC</div><h1 class="title">🔔 Rung Chuông Vàng</h1><h2>Bé văn minh thanh lịch</h2><p class="muted">Chọn bộ câu hỏi, suy nghĩ và chọn một đáp án. Mỗi bộ có số câu và nội dung theo tài liệu đính kèm.</p><div class="controls"><button class="btn primary" id="set1">Bộ số 1 · 18 câu</button><button class="btn" id="set2">Bộ số 2 · 20 câu</button></div></header><section class="panel" id="quiz"><div class="eyebrow" id="meta"></div><div class="progress"><span id="fill"></span></div><p class="qtext" id="question">Chọn một bộ câu hỏi để bắt đầu.</p><div class="options" id="options"></div><p class="status" id="feedback" aria-live="polite"></p><div class="controls"><button class="btn" id="prev">← Câu trước</button><button class="btn primary" id="next">Câu tiếp theo →</button></div></section><section class="panel end hidden" id="result"><div class="score" id="score"></div><h2>Hoàn thành thử thách!</h2><p id="summary" class="muted"></p><button class="btn primary" id="again">Chơi lại bộ này</button></section></main><script>const bank=[{"set":1,"n":1,"q":"Khi gặp người lớn tuổi như ông bà, bố mẹ hoặc cô giáo, bé nên làm gì để thể hiện sự lễ phép?","options":["Khoanh tay, cúi đầu và khoanh tay chào hỏi lễ phép.","Đứng yên không nói gì.","Nói to và gọi tên người lớn.","Nhìn người lớn rồi quay đi tiếp"],"answer":0},{"set":1,"n":2,"q":"Khi được người khác tặng quà hoặc giúp đỡ, bé nên nói từ gì?","options":["Nói lời Xin lỗi.","Nói lời Cảm ơn.","Nói lời Chào tạm biệt.","Không cần nói gì."],"answer":1},{"set":1,"n":3,"q":"Khi vô tình va trúng bạn hoặc làm rơi đồ của bạn, bé cần làm gì ngay lập tức?","options":["Đứng cười lớn.","Đổ lỗi cho bạn khác.","Khoanh tay xin lỗi và giúp bạn nhặt đồ lên.","Bỏ chạy thật nhanh."],"answer":2},{"set":1,"n":4,"q":"Khi nhận đồ từ tay người lớn, bé nên nhận bằng cách nào?","options":["Dùng chân đỡ lấy.","Nhận bằng hai tay và nói lời cảm ơn.","Chờ người lớn đặt xuống bàn mới lấy.","Dùng một tay giật lấy."],"answer":1},{"set":1,"n":5,"q":"Trong giờ ăn trưa tại lớp, hành động nào dưới đây là thanh lịch và văn minh?","options":["Nói chuyện to tiếng và vừa ăn vừa đùa giỡn.","Bỏ dở toàn bộ phần ăn.","Ăn gọn gàng, không rơi vãi và biết nhặt cơm rơi vào đĩa đựng rác.","Bốc thức ăn bằng tay."],"answer":2},{"set":1,"n":6,"q":"Khi muốn phát biểu ý kiến trong giờ học, bé nên làm gì?","options":["Tự đập bàn để gây sự chú ý.","Giơ tay đẹp và chờ cô giáo mời mới đứng dậy phát biểu.","Hét thật to tên mình.","Nói chen ngang khi cô giáo đang giảng bài."],"answer":1},{"set":1,"n":7,"q":"Khi tham gia các hoạt động tập thể hoặc chờ lấy đồ ăn, bé nên ứng xử như thế nào?","options":["Xếp hàng ngay ngắn và kiên nhẫn chờ đến lượt.","Khóc nhè để được ưu tiên.","Xô đẩy bạn để chen lên phía trước.","Lấn hàng của các bạn nhỏ hơn."],"answer":0},{"set":1,"n":8,"q":"Khi thấy rác rơi trên sàn nhà hoặc sân trường, bé ngoan nên làm gì?","options":["Xé thêm rác vứt ra sân.","Nhặt rác và bỏ vào thùng rác đúng quy định.","Đá rác sang chỗ bạn khác.","Bỏ qua vì không phải rác của mình."],"answer":1},{"set":1,"n":9,"q":"Khi ho hoặc hắt hơi, bé nên làm gì để giữ vệ sinh cho mọi người xung quanh?","options":["Lấy tay hoặc khăn che miệng, quay đi chỗ khác.","Hắt hơi thật to vào mặt bạn.","Lau mũi vào áo của bạn.","Cười to sau khi hắt hơi."],"answer":0},{"set":1,"n":10,"q":"Trường hợp nào dưới đây thể hiện bé chưa lịch sự khi trò chuyện?","options":["Nói trống không, nói tục, chửi thề.","Chờ người khác nói xong mới trả lời.","Nói năng nhẹ nhàng, dạ vâng lễ phép.","Mỉm cười thân thiện khi giao tiếp."],"answer":0},{"set":1,"n":11,"q":"Khi đến nhà người khác chơi, bé văn minh nên làm gì trước khi vào nhà?","options":["Nhảy ngổn ngang lên ghế sofa.","Gõ cửa/bấm chuông, chào hỏi chủ nhà và tháo giày dép gọn gàng.","Tự ý chạy thẳng vào phòng ngủ.","Mở tủ lạnh tìm đồ ăn."],"answer":1},{"set":1,"n":12,"q":"Trang phục như thế nào được coi là sạch sẽ, gọn gàng và thanh lịch khi bé đến trường?","options":["Mặc đồng phục hoặc quần áo phẳng phiu, sạch sẽ, cài cúc đàng hoàng.","Mặc đồ ngủ đi học.","Đi dép lệch bên.","Quần áo xộc xệch, dính nhiều vết bẩn."],"answer":0},{"set":1,"n":13,"q":"Khi chơi chung đồ chơi với bạn tại lớp, bé nên làm gì?","options":["Ném đồ chơi xuống đất khi không thích.","Nhường nhịn, nhã nhặn chia sẻ đồ chơi cùng bạn.","Giành lấy đồ chơi và không cho bạn chơi cùng.","Giấu đồ chơi mang về nhà."],"answer":1},{"set":1,"n":14,"q":"Khi thấy người lớn đang bê đồ nặng, bé có thể làm gì?","options":["Đứng nhìn và cười.","Bỏ đi chỗ khác chơi.","Chạy ra làm vướng chân người lớn.","Chủ động hỏi: Cô/Bà ơi, để con xách giúp một tay ạ!"],"answer":3},{"set":1,"n":15,"q":"Tại nơi công cộng, bé nên giữ trật tự như thế nào?","options":["Chạy nhảy và gào thét thật to.","Bật nhạc to trên điện thoại.","Đi nhẹ, nói khẽ, không làm ảnh hưởng tới người xung quanh.","Đẩy xô các ghế ngồi."],"answer":2},{"set":1,"n":16,"q":"Khi muốn mượn bút màu của bạn, bé nên nói lời nào đúng chuẩn lịch sự?","options":["Cho tớ mượn cây bút màu này một chút được không?","Tự tay giật bút từ tay bạn.","Đưa bút đây cho tớ ngay!","Lén lấy bút khi bạn không chú ý."],"answer":0},{"set":1,"n":17,"q":"Đặc trưng nét đẹp ứng xử của Người Hà Nội thanh lịch, văn minh hay em bé ngoan là gì?","options":["Nói lời hay, làm việc tốt, biết kính trên nhường dưới.","Chỉ làm việc tốt khi có quà thưởng.","Thích tranh cãi và không chịu lắng nghe.","Chen lấn khi xếp hàng."],"answer":0},{"set":1,"n":18,"q":"Sau khi đi vệ sinh xong, bé cần làm gì để giữ vệ sinh và văn minh?","options":["Vứt giấy vệ sinh ra sàn nhà.","Vội vàng không xả nước.","Chạy ngay ra ngoài chơi không rửa tay.","Xả nước bồn cầu và rửa tay bằng xà phòng sạch sẽ."],"answer":3},{"set":2,"n":1,"q":"Khi gặp người lớn tuổi hoặc khách đến nhà, bé nên làm gì để thể hiện sự lễ phép?","options":["Quay đi chỗ khác hoặc im lặng.","Khoanh tay, cúi đầu nhẹ và khoanh tay chào lễ phép.","Chạy vội vào phòng không nói gì."],"answer":1},{"set":2,"n":2,"q":"Khi được người khác tặng quà, khen ngợi hoặc giúp đỡ, bé cần nói từ gì?","options":["Xin lỗi","Cảm ơn","Không có gì"],"answer":1},{"set":2,"n":3,"q":"Khi vô tình làm ngã bạn hoặc làm hỏng đồ chơi của bạn, bé nên làm gì?","options":["Bỏ chạy thật nhanh.","Đổ lỗi cho bạn khác.","Đỡ bạn dậy và khoanh tay xin lỗi bạn."],"answer":2},{"set":2,"n":4,"q":"Khi muốn ngắt lời người lớn hoặc nhờ giúp việc gì, bé nên nói như thế nào?","options":["Mở to tiếng gọi giật giọng.","Nói Dạ thưa..., nhẹ nhàng và đợi người lớn lắng nghe.","Khóc nhè để người lớn chú ý."],"answer":1},{"set":2,"n":5,"q":"Khi đi ăn cơm cùng gia đình, hành vi nào thể hiện sự văn minh, lễ phép?","options":["Tranh ăn trước miếng ngon nhất.","Mời người lớn trước khi ăn.","Vừa ăn vừa la hét, gõ thìa bát gây tiếng động lớn."],"answer":1},{"set":2,"n":6,"q":"Khi đi thang máy hoặc xếp hàng lấy đồ ăn tại trường, bé nên làm gì?","options":["Chen lấn, xô đẩy để lên trước.","Xếp hàng trật tự, kiên nhẫn chờ đến lượt mình.","Chạy nhảy nô đùa xung quanh hàng lối."],"answer":1},{"set":2,"n":7,"q":"Khi gặp cô giáo hoặc bạn bè vào buổi sáng, bé chào bằng tiếng Anh thế nào?","options":["Hello / Good morning!","Goodbye!","Thank you!"],"answer":0},{"set":2,"n":8,"q":"Khi người khác giúp đỡ hoặc tặng quà, bé đáp lại bằng từ tiếng Anh nào?","options":["Sorry!","Thank you!","Yes, please!"],"answer":1},{"set":2,"n":9,"q":"Sau khi ăn bánh kẹo hoặc uống sữa xong, rác nên để ở đâu?","options":["Vứt xuống sân trường hoặc lòng đường.","Bỏ vào thùng rác đúng nơi quy định.","Nhét vào hộc bàn hoặc góc lớp."],"answer":1},{"set":2,"n":10,"q":"Trong giờ học, đọc sách hoặc ngủ trưa, bé nên giữ trật tự thế nào?","options":["Nói chuyện to, hò reo cùng bạn.","Đi nhẹ, nói khẽ, giữ không gian yên tĩnh.","Bật nhạc to để nghe."],"answer":1},{"set":2,"n":11,"q":"Khi hắt hơi, ho hoặc ngáp, bé nên làm gì?","options":["Hắt hơi thẳng vào mặt bạn.","Che miệng bằng tay hoặc khăn giấy và ngoảnh mặt sang hướng khác.","Không cần làm gì."],"answer":1},{"set":2,"n":12,"q":"Khi chơi đồ chơi cùng các bạn, bé nên ứng xử thế nào?","options":["Giành hết đồ chơi đẹp về mình.","Nhường nhịn, chia sẻ và cùng chơi hòa thuận.","Giật đồ chơi trên tay bạn."],"answer":1},{"set":2,"n":13,"q":"Khi xem văn nghệ hoặc kịch, lúc tiết mục kết thúc bé nên làm gì?","options":["Đứng dậy đi về ngay.","Vỗ tay khen ngợi các diễn viên/bạn diễn.","Nói to chê bai tiết mục."],"answer":1},{"set":2,"n":14,"q":"Trang phục đi học đúng chuẩn Bé thanh lịch là như thế nào?","options":["Quần áo xộc xệch, dính bẩn.","Quần áo gọn gàng, sạch sẽ, phù hợp thời tiết.","Mặc đồ ngủ đi học."],"answer":1},{"set":2,"n":15,"q":"Ngày 20 tháng 10 là ngày lễ tôn vinh ai?","options":["Ngày Nhà giáo Việt Nam.","Ngày Phụ nữ Việt Nam.","Ngày Quốc tế Thiếu nhi."],"answer":1},{"set":2,"n":16,"q":"Để thể hiện tình yêu thương dành cho Mẹ nhân ngày 20/10, bé có thể làm gì?","options":["Đòi Mẹ mua nhiều đồ chơi đắt tiền.","Tự làm bưu thiếp, cắm hoa, ngoan ngoãn vâng lời.","Khóc nhè để Mẹ bế."],"answer":1},{"set":2,"n":17,"q":"Loài hoa nào thường được ví như tình yêu thương ấm áp, bao la của Mẹ?","options":["Hoa Hồng / Hoa Hướng Dương","Hoa Xương Rồng","Hoa Cỏ Mây"],"answer":0},{"set":2,"n":18,"q":"Hành vi nào giúp bé trở thành người con ngoan, trò giỏi?","options":["Thường xuyên xem điện thoại, tivi không nghe lời.","Tự giác hoàn thành việc cá nhân và lễ phép.","Nhờ ông bà đút cho ăn hằng ngày."],"answer":1},{"set":2,"n":19,"q":"Khi đi bộ trên đường cùng người lớn, bé nên đi ở đâu?","options":["Chạy nhảy dưới lòng đường.","Đi trên vỉa hè và nắm tay người lớn.","Đi giữa làn đường xe máy."],"answer":1},{"set":2,"n":20,"q":"Câu hỏi quyết định: Nếu thấy bạn nhỏ loay hoay không biết cất balo đúng vị trí, bé sẽ làm gì?","options":["Đứng cười và trêu chọc bạn.","Nhẹ nhàng hướng dẫn hoặc giúp bạn cất balo gọn gàng.","Bỏ đi chỗ khác."],"answer":1}];let set=1,items=bank.filter(q=>q.set===1),at=0,answers={};const $=id=>document.getElementById(id);function start(n){set=n;items=bank.filter(q=>q.set===n);at=0;answers={};$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('set1').classList.toggle('primary',n===1);$('set2').classList.toggle('primary',n===2);render()}function render(){const q=items[at];$('meta').textContent='BỘ SỐ '+set+' · CÂU '+(at+1)+' / '+items.length;$('fill').style.width=(at/items.length*100)+'%';$('question').textContent=q.q;$('options').replaceChildren();q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=String.fromCharCode(65+i)+'. '+o;if(answers[at]!==undefined){b.disabled=true;if(i===q.answer)b.classList.add('good');else if(i===answers[at])b.classList.add('bad')}b.onclick=()=>{answers[at]=i;render();$('feedback').textContent=i===q.answer?'✓ Chính xác!':'Chưa chính xác. Đáp án đúng được đánh dấu màu xanh.'};$('options').append(b)});$('feedback').textContent=answers[at]===undefined?'Chọn đáp án phù hợp.':(answers[at]===q.answer?'✓ Chính xác!':'Chưa chính xác. Đáp án đúng được đánh dấu màu xanh.');$('prev').disabled=at===0;$('next').textContent=at===items.length-1?'Xem kết quả':'Câu tiếp theo →'}function next(){if(at<items.length-1){at++;render();return}const score=items.filter((q,i)=>answers[i]===q.answer).length;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+' / '+items.length;$('summary').textContent='Bạn trả lời đúng '+score+' trên '+items.length+' câu ở Bộ số '+set+'.'}$('set1').onclick=()=>start(1);$('set2').onclick=()=>start(2);$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=next;$('again').onclick=()=>start(set);start(1);</script></body></html>
